/* Status chips — official labels only (visual; no rule change) */
.tag,.sheetpill,.task-flag,.flagtag,.v165-status{
  border-radius:4px!important;
  font-weight:750!important;
  letter-spacing:.1px;
}
.tag{background:#eef2f4;color:#4d6270;border:1px solid #d7e0e4}
.tag.green,.v165-status--done{background:#e5f5ec!important;color:#0d6b49!important;border-color:#b7dcc8!important}
.tag.amber,.v165-status--process,.v165-status--pending{background:#fff4df!important;color:#8a5914!important;border-color:#ecd4a4!important}
.tag.red{background:#fceceb!important;color:#9d3b3b!important;border-color:#ecc0c0!important}
.tag.unverified,.v165-status--unverified{
  background:#f7f4ee!important;color:var(--v165-warn)!important;border:1px dashed #d4b98a!important
}
.v165-status--normal{background:#eef2f4!important;color:#4d6270!important;border:1px solid #d7e0e4!important}
.v165-status--urgent,.flagtag:not(.buffer){background:#fff0e8!important;color:#9a3d16!important;border:1px solid #efc2a8!important}
.task-flag.ready{background:#e2f3e9!important;color:#0e764e!important;border:1px solid #b5dcc7}
.task-flag.done{background:#e7eef7!important;color:#285879!important;border:1px solid #c3d3e6}
.task-flag.block{background:#fff1d9!important;color:#91581b!important;border:1px solid #ebcfa0}
/* States */
.v165-state,.sheetempty,.v36-empty,.v49-no-data{
  text-align:center;padding:28px 18px;color:var(--v165-muted);font-size:12px;line-height:1.5;
}
.v165-state{border:1px dashed var(--v165-line);border-radius:8px;background:#fafcfc;margin:8px 0}
.v165-state b{display:block;color:var(--v165-ink);font-size:13px;margin-bottom:4px}
#v3-app td.sheetempty,#v3-app td.v165-state,#v3-app td.v36-empty{
  padding:42px 18px!important;white-space:normal!important;background:#f7faf9!important;
  border-bottom:0!important;
}
#v3-app td.v165-state--filter-empty{
  background:#f4f7f8!important;
  box-shadow:inset 0 0 0 1px #d0dcd8;
}
.v165-state--loading{border-style:solid;background:linear-gradient(90deg,#f4f8f7 25%,#eaf3ef 37%,#f4f8f7 63%);background-size:400% 100%;animation:v165-shimmer 1.2s ease infinite}
.v165-state--empty{background:#f7faf9}
.v165-state--filter-empty{background:#f8fafb;border-color:#c9d7d4}
.v165-state--error{background:#fff6f5;border-color:#e7b6b4;color:#8f3a3a}
.v165-state--unauthorized{background:#fff8ef;border-color:#e6c89a;color:#8a5a16}
.v165-state--unverified{background:#fbf8f1;border-color:#dfc79a;color:var(--v165-warn)}
.v165-skel{display:grid;gap:8px;padding:12px}
.v165-skel i{display:block;height:12px;border-radius:4px;background:linear-gradient(90deg,#e8efec 25%,#f4f8f7 37%,#e8efec 63%);background-size:400% 100%;animation:v165-shimmer 1.15s ease infinite}
@keyframes v165-shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
html.v3-auth-pending body::before{content:"Memverifikasi sesi V3…";background:var(--v165-green-soft)!important;color:var(--v165-ink)!important}
html.v3-auth-failed body::before{content:"Sesi tidak valid — mengalihkan ke login…";background:#fff6f5!important;color:#8f3a3a!important}
/* Toast feedback */
#toast.toast{
  border-left:4px solid #5aa888;
  background:#1c3e37;
  box-shadow:0 10px 28px rgba(16,42,32,.22);
  transition:opacity var(--v165-drawer-ms) ease,transform var(--v165-drawer-ms) ease;
}
#toast.toast.success{border-left-color:#2f9a68;background:#163c31}
#toast.toast.error{border-left-color:#d26a64;background:#3a2322}
#toast.toast.info{border-left-color:#5aa0c4;background:#1c3340}
#toast.toast.hidden{opacity:0;transform:translateY(6px);pointer-events:none}
button:disabled{opacity:.48;cursor:not-allowed}
button:disabled[title]{opacity:.5}
/* Drawer motion 120–180ms */
.drawerback{
  animation:v165-fade-in var(--v165-drawer-ms) ease;
}
.drawerback .drawer,
.drawerback .detaildrawer{
  animation:v165-drawer-in var(--v165-drawer-ms) ease;
  will-change:transform,opacity;
}
.drawerback.v165-closing{animation:v165-fade-out var(--v165-drawer-ms) ease forwards}
.drawerback.v165-closing .drawer,
.drawerback.v165-closing .detaildrawer{animation:v165-drawer-out var(--v165-drawer-ms) ease forwards}
@keyframes v165-fade-in{from{opacity:0}to{opacity:1}}
@keyframes v165-fade-out{from{opacity:1}to{opacity:0}}
@keyframes v165-drawer-in{from{transform:translateX(18px);opacity:.92}to{transform:translateX(0);opacity:1}}
@keyframes v165-drawer-out{from{transform:translateX(0);opacity:1}to{transform:translateX(22px);opacity:.9}}
@media (prefers-reduced-motion:reduce){
  .drawerback,.drawerback .drawer,.drawerback .detaildrawer,#toast.toast,#v3-app .sheet.excel-sheet tbody tr,#v3-app .navbtn{animation:none!important;transition:none!important}
  .v165-state--loading,.v165-skel i{animation:none!important}
}

function monitorBuffer(a){
 const list=a.filter(o=>o.bufferStock);const q=(window.monitorBufferQuery||'').toLowerCase();const rows=list.filter(o=>[o.id,o.name,o.item,o.branch].join(' ').toLowerCase().includes(q));

 `<div class="sheetbar"><input type="search" class="fieldcontrol" placeholder="Cari PO / outlet / item" value="${escape(window.monitorBufferQuery||'')}" oninput="window.monitorBufferQuery=this.value;document.getElementById('monitor-buffer-content').innerHTML=monitorBufferRows(active())"><span class="count">${rows.length} dari ${list.length} pekerjaan buffer</span></div>`+

function monitorKontrak(a){
 const q=window.monitorKontrakQuery||'';const rows=contractRows(a); const opts=['Semua','Aktif','Perlu tinjau','Selesai'];
 return heading('Monitoring PO Kontrak','Simulasi ringkasan kuota kontrak pelanggan; bukan data administrasi Accurate')+
 `<div class="monitor-note">Data simulasi 3 PO. Kuota kontrak, terpakai, dan sisa di halaman ini hanya ilustrasi fitur monitoring PO Kontrak; belum ada kontrak asli atau API Accurate.</div>`+
 `<div class="sheetbar"><input class="fieldcontrol" type="search" placeholder="Cari pelanggan / kode kontrak" value="${escape(q)}" oninput="window.monitorKontrakQuery=this.value;document.getElementById('monitor-kontrak-content').innerHTML=monitorKontrakRows(active())"><span class="count">${rows.length} PO Kontrak contoh</span></div>`+

function contractRows(a){return [] /* Renea test has no contract document; never fabricate an active contract */}
function monitorKontrakRows(a){const q=(window.monitorKontrakQuery||'').toLowerCase();const all=contractRows(a);const rows=all.filter(c=>[c.id,c.customer,c.po,c.status].join(' ').toLowerCase().includes(q));return `<div class="monitor-scroll"><table class="monitor-table"><thead><tr><th>NO KONTRAK</th><th>PELANGGAN</th><th>REFERENSI SO</th><th>KUOTA (PCS)</th><th>TERPAKAI</th><th>SISA KUOTA</th><th>STATUS</th><th>DETAIL</th></tr></thead><tbody>${rows.map(c=>`<tr><td><b>${escape(c.id)}</b></td><td>${escape(c.customer)}</td><td>${escape(c.po)}</td><td>${fmt(c.qty)}</td><td>${fmt(c.used)}</td><td><b>${fmt(c.remaining)}</b></td><td>${tag(c.status)}</td><td><button class="btn sm" onclick="showScheduleDetail('${c.po}')">ⓘ PO</button></td></tr>`).join('')||'<tr><td colspan="8">Tidak ada kontrak yang sesuai.</td></tr>'}</tbody></table></div><div class="sheetfoot"><span>Menampilkan ${rows.length} dari ${all.length} kontrak — Renea belum memiliki referensi kontrak dalam fixture.</span>${v162ResetLebarBtn(COLW_KEYS.kontrak)}</div>`}

// RENEA COFFEE FIXTURE — no old demo PO or inventory values are loaded.
const RENEA_ID='SO/10/11/2026/001';
const seed=[];
// This is the prior E2E business fixture (5,000 pcs), not an Accurate Online import.
// COLOR & SALES CONTRACT (DATA DUMMY): no external Accurate identity is inferred.
const demoSalesNames=['Sales Jogja A','Sales Jogja B','Sales Semarang A','Sales Semarang B'];
const demoInkSets=[['Hitam','Putih','Merah','Emas'],['Hitam','Merah','Biru','Putih'],['Hijau','Putih','Kuning','Hitam'],['Cokelat','Krem','Emas','Hitam'],['Biru','Putih','Merah','Hitam'],['Merah','Hitam','Putih','Kuning']];
function sampleColorEntries(o){
 if(Array.isArray(o.inkColors)&&o.inkColors.length)return o.inkColors.slice(0,4).map((x,i)=>({order:i+1,name:String(x.name||x||'Belum tercatat')}));
 const count=Math.max(1,Math.min(4,Number(String(o.item||'').match(/([1-4])\s*warna/i)?.[1]||1)));
 const seq=demoInkSets[(Number(String(o.id||'').split('/').pop())||1)%demoInkSets.length];
 return Array.from({length:count},(_,i)=>({order:i+1,name:seq[i]}));
}
function sampleSalesName(o){
 if(o&&o.salesName&&o.salesName!=='Belum terverifikasi')return o.salesName;
 return 'Belum terverifikasi';
}
function stackedColors(o,format){const colors=sampleColorEntries(o);return colors.map((x,i)=>`<div class="ink-line"><span class="ink-index">${format==='number'?`Ke-${x.order}`:String(x.order).padStart(2,'0')}</span>${format==='number'?'':`<b>${escape(x.name)}</b>`}</div>`).join('')}
seed.forEach(o=>{o.salesName=sampleSalesName(o);o.inkColors=sampleColorEntries(o)});
// V18 — satu baris sheet per lintasan WARNA, bukan satu baris per PO.
// Baris warna memiliki operator/mesin sendiri; Qty SO tetap satu identitas, tidak dijumlahkan berulang.
const demoOperators=['Rizki','Bima','Doni','Sinta','Aditya','Operator A'];
const demoMachines=['Semi Auto 01','Semi Auto 02','Semi Auto 03','Semi Auto 04','Kurva 01'];
// V19 — Schedule assignment identity is distinct from the PO and color-pass identity.
// A multi-colour cup is the SAME physical cup processed in successive passes; never sum pass quantities as PO physical qty.
const scheduleOperators=['Rizki','Bima','Doni','Sinta','Aditya','Operator A'];
const scheduleMachines=['Semi Auto 01','Semi Auto 02','Semi Auto 03','Semi Auto 04','Semi Auto 05','Kurva 01'];
let scheduleDraft=null;
let scheduleSeq=0;
function makeScheduleId(){return 'asg-'+Date.now().toString(36)+'-'+(++scheduleSeq).toString(36)}
function formatScheduleISO(s){const m=String(s||'').match(/^(\d{1,2}) Nov (\d{4})$/);return m?`${m[2]}-11-${m[1].padStart(2,'0')}`:'2026-11-09'}
function ensureScheduleAssignments(o){
 if(Array.isArray(o.productionAssignments))return o.productionAssignments;
 // Live: never invent demo operator assignments from stage/Terproses.
 if(isLiveInbox()){o.productionAssignments=[];return o.productionAssignments}
 // Legacy V18 per-colour operators are a one-row-per-colour seed, NOT a loss of historical output provenance.
 const colors=sampleColorEntries(o),old=Array.isArray(o.colorAssignments)?o.colorAssignments:[];
 const planned=o.stage!=='inbox';
 o.productionAssignments=planned?colors.map((c,i)=>({
  id:makeScheduleId(),colorIndex:i+1,colorName:c.name,
  operator:String(old[i]?.operator??(i===0?o.operator:scheduleOperators[(i+2)%scheduleOperators.length])??''),
  machine:String(old[i]?.machine??(i===0?o.machine:scheduleMachines[i%scheduleMachines.length])??''),
  workDate:formatScheduleISO(o.scheduleDate),targetQty:Math.max(0,Number(o.scheduledQty)||0),
  completedQty:null,legacy:true
 })).filter(r=>r.operator&&r.machine&&r.targetQty>0):[];
 return o.productionAssignments;
}
function scheduleTotals(rows,o){
 const colors=sampleColorEntries(o),totals=colors.map(c=>({index:c.order,name:c.name,assigned:rows.filter(r=>Number(r.colorIndex)===c.order).reduce((n,r)=>n+(Number(r.targetQty)||0),0)}));
 // Effective PO scheduled qty = lowest pass coverage. A 2-colour 10k PO needs 10k on BOTH passes, not 20k physical units.
 return {colors:totals,effective:totals.length?Math.min(...totals.map(x=>x.assigned)):0,operations:totals.reduce((n,x)=>n+x.assigned,0)};
}
function colorAssignmentsFor(o){
 const ass=ensureScheduleAssignments(o),colors=sampleColorEntries(o);
 return ass.map(a=>({...a,colorName:colors.find(c=>c.order===Number(a.colorIndex))?.name||a.colorName||'—',completedQty:v23Done(o,a.id)||a.completedQty}));
}
function scheduleColorRows(rows){
 return rows.filter(hasPrintLine).flatMap(o=>{
  const colors=sampleColorEntries(o),asgs=colorAssignmentsFor(o);
  // A no-assignment PO still shows one distinguishable unscheduled row per colour.
  return colors.flatMap(c=>{
   const matching=asgs.filter(a=>Number(a.colorIndex)===c.order);
   const list=matching.length?matching:[{id:'',colorIndex:c.order,colorName:c.name,operator:'',machine:'',targetQty:0,completedQty:null,workDate:'',placeholder:true}];
   return list.map(a=>({...o,colorWorkItem:true,colorIndex:c.order,colorName:c.name,
    operator:a.operator,machine:a.machine,assignmentId:a.id,assignmentQty:Number(a.targetQty)||0,
    assignmentCompleted:a.completedQty,assignmentDate:a.workDate||'',colorRowKey:o.id+'#W'+c.order+'#'+(a.id||'empty')}));
  });
 });
}
function editColorAssignment(id,index){openScheduleEditor(id,index)}
function openScheduleEditor(id,focusColor){
 const o=orders.find(x=>x.id===id&&!x.deleted);if(!o)return;if(!hasPrintLine(o)){toast('PO non-cetak tidak memerlukan penjadwalan operator sablon');return;}
 if(isLiveInbox()&&!o.qtyVerified){toast('Qty PO belum terverifikasi — penjadwalan diblokir hingga detail Accurate memuat qty resmi');return;}

}
function scheduleEditorRow(row,i,o){
 const colors=sampleColorEntries(o),selected=colors.some(c=>c.order===Number(row.colorIndex))?Number(row.colorIndex):1;

   <label>Mesin <select onchange="updateScheduleDraft('${escape(row.id)}','machine',this.value)"><option value="">Pilih mesin</option>${scheduleMachines.map(x=>`<option value="${escape(x)}" ${row.machine===x?'selected':''}>${escape(x)}</option>`).join('')}</select></label>
   <label>Tanggal <input type="date" value="${escape(row.workDate||'2026-11-09')}" onchange="updateScheduleDraft('${escape(row.id)}','workDate',this.value)"></label>
   <label>Target (pcs) <input type="number" min="1" step="1" max="${o.qty}" value="${escape(row.targetQty??'')}" oninput="updateScheduleDraft('${escape(row.id)}','targetQty',this.value)"></label>
   <label>Sudah cetak <input readonly value="${row.completedQty==null?'Belum dicatat per operator':fmt(row.completedQty)+' pcs'}" title="Output PO historis tidak dibagikan secara otomatis"></label>
  </div>
  ${locked?'<div class="assignment-locked">Progres lama masih pada tingkat PO; untuk menjaga histori, penugasan asal tidak dapat dihapus. Alokasi sisa dapat ditambahkan.</div>':''}
 </div>`;
}
function renderScheduleEditor(){
 if(!scheduleDraft)return;
 const o=orders.find(x=>x.id===scheduleDraft.id&&!x.deleted);if(!o)return;
 const t=scheduleTotals(scheduleDraft.rows,o);
 const gatesOk=bothOfficialGatesOk(o);
 $('modal').innerHTML=`<div class="drawerback" onclick="if(event.target===this)closeScheduleEditor()"><aside class="drawer schedule-editor" role="dialog" aria-modal="true" aria-label="Penjadwalan multioperator">
  <div class="drawerhead"><div><div class="eyebrow">PENJADWALAN MULTIOPERATOR · DATA DEMO</div><h2>${escape(o.id)} · ${escape(o.name)}</h2><div class="row">${tag(o.status)}<span class="sheetpill">${fmt(o.qty)} pcs · ${sampleColorEntries(o).length} warna · ${escape(sampleSalesName(o))}</span></div></div><button class="btn sm" onclick="closeScheduleEditor()">✕ Tutup</button></div>
  <div class="drawerbody"><div class="schedule-note">Satu PO dapat dijadwalkan ke beberapa operator dan mesin. Setiap warna adalah <b>lintasan cetak pada cup yang sama</b>; target semua warna tidak dijumlahkan menjadi Qty fisik PO.</div>
  <div class="schedule-quick"><div><small>Qty SO fisik</small><strong>${fmt(o.qty)} pcs</strong></div><div><small>Total penugasan</small><strong>${scheduleDraft.rows.length} operator/warna</strong></div><div><small>Target fisik efektif</small><strong id="schedule-effective">${fmt(t.effective)} pcs</strong></div></div>
  <div class="schedule-toolbar"><b>Alokasi per operator dan warna</b><button class="btn primary sm" onclick="addScheduleRow()">＋ Tambah Operator</button></div>
  <div id="schedule-assignment-list">${scheduleDraft.rows.map((r,i)=>scheduleEditorRow(r,i,o)).join('')||'<div class="empty">Belum ada penugasan. Tambahkan operator untuk membuat jadwal.</div>'}</div>
  <div class="sectionlabel">Rekap Alokasi per Warna</div><div id="schedule-totals">${scheduleTotalsMarkup(t,o)}</div>
  ${o.done>0?`<div class="schedule-note warning">Sudah ada output PO ${fmt(o.done)} pcs, tetapi riwayat lama belum memiliki rincian output per operator/warna. Rekap di atas hanya TARGET penugasan, bukan hasil cetak aktual per operator.</div>`:''}
  <div id="schedule-error" aria-live="polite" class="schedule-error hidden"></div>
  <div class="inputnote">Simpan jadwal membutuhkan Design Gate + Payment Gate. Monitoring boleh tanpa ACC.</div></div>
  <div class="drawerfoot"><button class="btn" onclick="closeScheduleEditor()">Batal</button><button class="btn primary" ${!gatesOk?'disabled title="Design Gate dan Payment Gate belum satisfied"':''} onclick="saveScheduleEditor()">Simpan Semua Jadwal</button></div>
  </aside></div>`;
 const focus=$('schedule-assignment-list')?.querySelector(`[data-asg]`);

function setDesign(s,v=true){s.design=v;if(!v&&(s.assignments.length||s.outputs.length))s.hold=true;s.logs.push('design '+v)}
function setReady(s){setPayment(s);setDesign(s)}
function addColor(s,c){guard(!s.assignments.length,'COLOUR_LOCKED_AFTER_SCHEDULE');guard(s.printColors.length<4,'MAX_FOUR_COLOURS');guard(!s.printColors.includes(c),'COLOUR_DUPLICATE');s.printColors.push(c)}
function addAssign(s,operator,color,qty,date='2026-11-10',machine='Semi Auto 01'){
 guard(s.status==='active'&&!s.hold,'SO_NOT_ACTIVE');guard(s.payment&&s.design,'APPROVAL_REQUIRED');guard(s.printColors.includes(color),'UNKNOWN_COLOUR');
 guard(Number.isSafeInteger(qty)&&qty>0,'QTY_INVALID');guard(typeof operator==='string'&&operator.trim()&&machine&&date,'ASSIGNMENT_INCOMPLETE');
 guard(s.assignments.filter(a=>a.color===color).reduce((n,a)=>n+a.qty,0)+qty<=s.qty,'OVER_ALLOCATION');
 const id='a'+(s.assignments.length+1);s.assignments.push({id,operator,color,qty,done:0,machine,date});return id
}
function prepare(s,n){guard(Number.isSafeInteger(n)&&n>0&&n<=s.qty,'PREP_QTY_INVALID');guard(n>=Math.max(0,...s.outputs.map(x=>x.qty)),'PREP_BELOW_OUTPUT');s.prepared=n}
function addScreen(s,n){guard(Number.isSafeInteger(n)&&n>0,'SCREEN_QTY_INVALID');s.screen=n}
function approveSample(s){guard(s.sample&&s.screen>0&&s.prepared>0,'SAMPLE_NOT_READY');s.sampleApproved=true}
function passQty(s,c){return s.assignments.filter(a=>a.color===c).reduce((n,a)=>n+a.done,0)}
function availableForPack(s){return s.printColors.length?Math.min(...s.printColors.map(c=>passQty(s,c))):0}
function printOn(s,id,qty){
 const a=s.assignments.find(x=>x.id===id);guard(!!a,'ASSIGNMENT_NOT_FOUND');guard(s.status==='active'&&!s.hold,'JOB_HELD');guard(s.sampleApproved,'SAMPLE_NOT_APPROVED');
 guard(Number.isSafeInteger(qty)&&qty>0,'QTY_INVALID');guard(a.done+qty<=a.qty,'OUTPUT_OVER_ASSIGNMENT');
 guard(passQty(s,a.color)+qty<=s.prepared,'OUTPUT_OVER_PREPARED');
 const ci=s.printColors.indexOf(a.color);if(ci>0)guard(passQty(s,s.printColors[ci-1])>=passQty(s,a.color)+qty,'SECOND_COLOUR_BEFORE_FIRST');
 a.done+=qty;s.outputs.push({id:'e'+(s.outputs.length+1),assignment:id,colour:a.color,qty});return a.done
}
function moveRemaining(s,id,operator){const a=s.assignments.find(x=>x.id===id);guard(!!a,'ASSIGNMENT_NOT_FOUND');const remain=a.qty-a.done;guard(remain>0,'NO_REMAINING');guard(operator&&operator!==a.operator,'TARGET_OPERATOR_REQUIRED');a.qty=a.done;const n={id:'a'+(s.assignments.length+1),operator,color:a.color,qty:remain,done:0,machine:'Semi Auto 02',date:a.date};s.assignments.push(n);return n.id}
function cancelRemaining(s,id,n){const a=s.assignments.find(x=>x.id===id);guard(!!a,'ASSIGNMENT_NOT_FOUND');guard(Number.isSafeInteger(n)&&n>0&&n<=a.qty-a.done,'CANCEL_EXCEEDS_REMAINING');a.qty-=n;return a.qty}
function pack(s,qty){guard(Number.isSafeInteger(qty)&&qty>0,'PACK_QTY_INVALID');guard(s.packing+qty<=availableForPack(s),'PACK_OVER_FINISHED');s.packing+=qty}
function createSJ(s,ref,qty){guard(s.status==='active'&&!s.hold,'SO_NOT_ACTIVE');guard(ref&&!s.sjs.some(x=>x.ref===ref),'SJ_DUPLICATE');guard(qty>0&&Number.isSafeInteger(qty),'SJ_QTY_INVALID');guard(s.sjs.filter(x=>x.active).reduce((n,x)=>n+x.qty,0)+qty<=s.qty,'SJ_OVER_SO');s.sjs.push({ref,qty,loaded:0,received:0,active:true,proof:false})}
function loadSJ(s,ref,qty){const d=s.sjs.find(x=>x.ref===ref&&x.active);guard(!!d,'SJ_NOT_ACTIVE');guard(Number.isSafeInteger(qty)&&qty>0&&qty>=d.loaded,'LOADING_INVALID');guard(qty<=d.qty&&qty<=s.packing,'LOADING_OVER_PACKING_OR_SJ');d.loaded=qty}
function receiveSJ(s,ref,qty,proof){const d=s.sjs.find(x=>x.ref===ref&&x.active);guard(!!d,'SJ_NOT_ACTIVE');guard(Number.isSafeInteger(qty)&&qty>0&&qty>=d.received&&qty<=d.loaded,'RECEIPT_QTY_INVALID');guard(proof&&proof.receiver&&proof.photo&&proof.signature,'POD_PROOF_MISSING');d.received=qty;d.proof=true}
function deleteSJ(s,ref){const d=s.sjs.find(x=>x.ref===ref&&x.active);guard(!!d,'SJ_NOT_ACTIVE');d.active=false;s.logs.push('SJ soft delete '+ref+'; evidence preserved');if(d.received>0)s.hold=true}
function cancelSO(s){guard(s.status==='active','SO_NOT_ACTIVE');s.status='cancelled';s.archived=true;if(s.outputs.length||s.packing||s.sjs.some(x=>x.received))s.hold=true;s.logs.push('SO cancelled; historic outputs retained')}
function deleteSO(s){guard(s.status==='active','SO_NOT_ACTIVE');s.status='deleted_in_accurate';s.archived=true;if(s.assignments.length||s.outputs.length)s.hold=true;s.logs.push('SO deleted; hidden active; work preserved')}
function voidReceipt(s){s.payment=false;if(s.assignments.length||s.outputs.length)s.hold=true;s.logs.push('Receipt deleted; approval recheck')}
function assertThrows(fn,code){try{fn();throw Error('MISSING_REJECTION_'+code)}catch(e){if(e.message==='MISSING_REJECTION_'+code)throw e;if(code&&!String(e.message).includes(code))throw Error('WRONG_REJECTION '+e.message)}}
function eq(a,b,msg){guard(JSON.stringify(a)===JSON.stringify(b),'ASSERT_'+msg+': '+JSON.stringify(a)+' != '+JSON.stringify(b))}
const reneaCases=[];
function caseR(id,group,title,desc,fn,expected='Diterima / ditolak sesuai kontrak',category='TEST'){reneaCases.push({id,group,title,desc,fn,expected,category})}
function setupPrint(s,{qty=5000,colors=['Putih'],operators=['Bima']}={}){setReady(s);s.printColors=colors;const as=[];operators.forEach((name,i)=>as.push(addAssign(s,name,colors[0],qty/operators.length|0)));return as}
function fullPrint(s){setReady(s);const id=addAssign(s,'Bima','Putih',5000);prepare(s,5000);addScreen(s,1);s.sample=true;approveSample(s);printOn(s,id,5000);return id}

let integrityNotice='Fixture bersih · belum ada output/SJ';
const v25Iso=()=>new Date().toISOString();
const v25Positive=n=>Number.isSafeInteger(Number(n))&&Number(n)>0;

function v25Data(o){if(!o.v25)o.v25={designApproved:false,paymentConfirmed:false,screenQty:0,preparedQty:0,sampleApproved:false,holdReasons:[],soSource:'ACTIVE',soRevision:1,assignments:[],outputEvents:[],packing:0,shipments:[],changeHistory:[],seq:0};return o.v25}

function v25Order(){return orders.find(o=>o.id===RENEA_ID)}
function v25Active(o){return !!o&&!o.deleted&&v25Data(o).soSource==='ACTIVE'}
function v25CanWork(o){const d=v25Data(o);return v25Active(o)&&d.holdReasons.length===0&&d.designApproved&&d.paymentConfirmed}
function v25SetGate(kind,ok){const o=v25Order(),d=v25Data(o);if(!v25Active(o))return v25Error('SO tidak aktif. Bukti tetap tersimpan');if(!['design','payment'].includes(kind))return false;
 if(kind==='design')d.designApproved=ok;else d.paymentConfirmed=ok;
 const reason=kind==='design'?'DESIGN_REVOKED':'PAYMENT_REVOKED';if(!ok&&v25HasWork(d)&&!d.holdReasons.includes(reason))d.holdReasons.push(reason);
 // Restoring source evidence does NOT automatically lift an operational HOLD.
 v25Event(o,'GATE SIMULASI',`${kind} = ${ok?'APPROVED':'REVOKED'}${d.holdReasons.length?' · HOLD perlu review':''}`);render();return true}
function v25HasWork(d){return d.assignments.length>0||d.outputEvents.length>0||d.packing>0||d.shipments.some(x=>x.loaded>0||x.received>0)}
function v25ReviewHold(){const o=v25Order(),d=v25Data(o);if(!v25Active(o))return v25Error('SO sudah diarsipkan; tidak dapat dibuka kembali dari demo');if(!d.designApproved||!d.paymentConfirmed)return v25Error('Bukti desain dan pembayaran belum valid');if(d.shipments.some(x=>!x.active&&(x.loaded>0||x.received>0)))return v25Error('SJ inaktif sudah mempunyai realisasi fisik; wajib rekonsiliasi dokumen resmi');d.holdReasons=[];v25Event(o,'REVIEW HOLD','HOLD diangkat melalui review simulasi setelah bukti dipulihkan');render();return true}

function v25SetColors(count){const o=v25Order(),d=v25Data(o);count=Number(count);if(![1,2,3,4].includes(count)||v25HasWork(d))return v25Error('Warna hanya dapat diubah sebelum jadwal/output dibuat');const names=['Putih','Hitam','Emas','Merah'];o.inkColors=names.slice(0,count).map((name,i)=>({order:i+1,name}));v25Event(o,'REVISI PROSES',`Demo disetel ke ${count} lintasan warna sebelum pekerjaan dimulai`);render();return true}
function v25Assign(operator,colorIndex,qty,machine,date,lot='LOT-01'){const o=v25Order(),d=v25Data(o);if(!v25CanWork(o))return v25Error('Gate/HOLD belum memenuhi syarat penjadwalan');
 qty=Number(qty);colorIndex=Number(colorIndex);operator=String(operator||'').trim();machine=String(machine||'').trim();
 const colors=sampleColorEntries(o);if(!v25Positive(qty)||!operator||!machine||!date||!String(lot||'').trim()||!colors.some(c=>c.order===colorIndex))return v25Error('Operator, warna, mesin, tanggal dan qty wajib valid');
 const assigned=d.assignments.filter(a=>a.colorIndex===colorIndex).reduce((n,a)=>n+a.targetQty,0);if(assigned+qty>o.qty)return v25Error('Total penugasan warna melebihi Qty PO');
 const a={id:`AS-${++d.seq}`,operator,colorIndex,colorName:colors.find(c=>c.order===colorIndex).name,targetQty:qty,machine,date,lotId:String(lot).trim()};d.assignments.push(a);v25Event(o,'PENJADWALAN',`${operator} · warna ${colorIndex} · ${fmt(qty)} pcs`);render();return true}

function v25Output(aid,qty,key){const o=v25Order(),d=v25Data(o),a=d.assignments.find(x=>x.id===aid);qty=Number(qty);key=String(key||'').trim();if(!v25CanWork(o))return v25Error('Output diblokir karena gate/HOLD tidak valid');if(!d.sampleApproved||d.screenQty<1||d.preparedQty<1)return v25Error('Screen, persiapan cup dan approval sampel wajib lengkap');if(!a||!v25Positive(qty)||!key)return v25Error('Assignment, qty dan event key wajib valid');

 if(a.colorIndex>1&&v25Pass(o,a.colorIndex,a.lotId)+qty>v25Pass(o,a.colorIndex-1,a.lotId))return v25Error(`Warna ${a.colorIndex} melebihi hasil valid warna ${a.colorIndex-1}`);

function v25Load(ref,qty){const o=v25Order(),d=v25Data(o),sj=d.shipments.find(x=>x.ref===ref&&x.active);qty=Number(qty);if(!v25CanWork(o))return v25Error('HOLD / gate tidak mengizinkan loading');if(!sj)return v25Error('SJ tidak aktif');if(!v25Positive(qty)||qty<sj.loaded||qty<sj.received||qty>sj.qty)return v25Error('Loading tidak valid terhadap SJ');

function flow31(o){if(!o||!o.sourceLines)return null;

function flow31TaskId(t,line){return `${t}@${line}`}
function flow31Parse(id){const p=String(id).split('@');return {kind:p[0],lineId:p.slice(1).join('@')}}
function flow31Tasks(o){if(o.deleted)return [];
 const tasks=[];for(const l of o.sourceLines||[]){
  const mode=effectiveLineMode(o,l);
  if(mode==='UNKNOWN')continue; // verification queue is Jadwal/Inbox — not fake print/non-print tasks
  const print=mode==='PRINT';
  let types;
  if(print){
   // Official: Upload Design without payment; downstream only after schedule evidence.
   const hasSchedule=isLiveInbox()
    ?(Array.isArray(o.productionAssignments)&&o.productionAssignments.some(a=>String(a.soLineId||a.lineId||'')===String(l.id)))
    :!!(flow31Line(o,l.id)?.schedule?.length);
   types=hasSchedule
    ?['design','schedule','screen','prepare','sample','sampleapprove','print','packing']
    :['design','schedule'];
  }else{
   types=gateOk(paymentGateLabel(o))?['stockpack']:[]; // non-print: packing only, no prep/screen/sample/print
  }

        chip.textContent=(auth.username||'user')+(auth.role?' · '+auth.role:'');
        chip.title='Sesi terautentikasi';
      }else if(auth&&auth.status==='failed'){
        chip.textContent='Sesi · tidak valid';
      }else{
        chip.textContent='Sesi · belum teridentifikasi';
      }
    }
    const crumb=document.getElementById('v3-page-crumb');
    if(crumb&&typeof pageTitle==='function'&&typeof section!=='undefined'){
      crumb.textContent=pageTitle(section);
    }
  }
  const wrap=function(fn){
    if(typeof fn!=='function'||fn.__finalShellWrapped)return fn;
    const out=function(){const r=fn.apply(this,arguments);try{syncShellMeta();if(typeof v41UpdateSidebarButton==='function')v41UpdateSidebarButton();}catch(e){}return r;};
    out.__finalShellWrapped=true;return out;
  };
  window.render=wrap(window.render);
  document.addEventListener('DOMContentLoaded',syncShellMeta);
  setTimeout(syncShellMeta,0);
})();
</script>
