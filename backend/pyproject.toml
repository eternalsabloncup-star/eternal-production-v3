[project]
name = "eternal-production-v3-backend"
version = "0.1.0"
description = "ETERNAL PRODUCTION V3 backend foundation"
requires-python = ">=3.12"

[tool.pytest.ini_options]
markers = ["strict_line_qty: enforce PO line sync for schedule cap", "strict_loading_cap: enforce packing cap for loading", "production_defaults: run with untouched production safety defaults"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  "ignore::DeprecationWarning",
]
