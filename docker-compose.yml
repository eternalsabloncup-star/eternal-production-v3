services:
  postgres:
    image: postgres:16-alpine
    container_name: epv3-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eternal_production_v3_dev}
      POSTGRES_USER: ${POSTGRES_USER:-epv3_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      # Local-only binding — never expose publicly
      - "127.0.0.1:5432:5432"
    volumes:
      - epv3_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  epv3_pgdata:
    name: epv3_postgres_dev_data
