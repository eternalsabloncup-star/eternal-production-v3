name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  backend:
    name: Backend (Postgres + Pytest + Alembic)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eternal_production_v3_test
          POSTGRES_USER: epv3_test
          POSTGRES_PASSWORD: epv3_ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U epv3_test -d eternal_production_v3_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      APP_DEBUG: "false"
      API_PREFIX: /api/v1
      # Dedicated CI test DB only — never V2 / production credentials
      TEST_DATABASE_URL: postgresql+asyncpg://epv3_test:epv3_ci_test_only@127.0.0.1:5432/eternal_production_v3_test
      TEST_DATABASE_URL_SYNC: postgresql+psycopg2://epv3_test:epv3_ci_test_only@127.0.0.1:5432/eternal_production_v3_test
      DATABASE_URL: postgresql+asyncpg://epv3_test:epv3_ci_test_only@127.0.0.1:5432/eternal_production_v3_test
      DATABASE_URL_SYNC: postgresql+psycopg2://epv3_test:epv3_ci_test_only@127.0.0.1:5432/eternal_production_v3_test
      V3_JWT_SECRET: v3_ci_jwt_secret_not_from_v1
      V3_PASSWORD_PEPPER: v3_ci_password_pepper_distinct
      V3_ACCURATE_READ_GATEWAY_URL: http://127.0.0.1:9
      V3_ACCURATE_READ_GATEWAY_TOKEN: ci-gateway-token

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python syntax check
        run: python -m compileall -q app alembic tests

      - name: Import check
        run: python -c "from app.main import app; print(app.title)"

      - name: Alembic upgrade + single head
        run: |
          alembic upgrade head
          heads="$(alembic heads)"
          echo "$heads"
          count="$(alembic heads | wc -l)"
          test "$count" -eq 1

      - name: Pytest
        run: pytest -q

  frontend:
    name: Frontend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    env:
      VITE_API_BASE_URL: http://127.0.0.1:8000/api/v1

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
